<!DOCTYPE html>
<html>
<head>
    <title>Chaosflix</title>
</head>
<body>
    <div id="ChaosflixConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
         data-require="emby-select">
        <div data-role="content">
            <div class="content-primary">
                <form id="ChaosflixConfigForm">
                    <div class="verticalSection">
                        <h2 class="sectionTitle">Chaosflix Settings</h2>

                        <div class="selectContainer">
                            <label class="selectLabel" for="PreferredQuality">Preferred Quality</label>
                            <select is="emby-select" id="PreferredQuality" class="emby-select-withcolor">
                                <option value="High">High (1080p)</option>
                                <option value="Standard">Standard (576p)</option>
                            </select>
                        </div>

                        <div class="selectContainer">
                            <label class="selectLabel" for="PreferredFormat">Preferred Format</label>
                            <select is="emby-select" id="PreferredFormat" class="emby-select-withcolor">
                                <option value="Mp4">MP4 (H.264)</option>
                                <option value="WebM">WebM (VP9)</option>
                            </select>
                        </div>

                        <div class="selectContainer">
                            <label class="selectLabel" for="PreferredLanguage">Preferred Language</label>
                            <select is="emby-select" id="PreferredLanguage" class="emby-select-withcolor">
                                <option value="">Original</option>
                                <option value="deu">Deutsch</option>
                                <option value="eng">English</option>
                            </select>
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel" for="ApiBaseUrl">API Endpoint</label>
                            <input is="emby-input" type="text" id="ApiBaseUrl" placeholder="https://api.media.ccc.de/public" />
                            <div class="fieldDescription">Leave empty for media.ccc.de. Set it to use a mirror.</div>
                        </div>
                    </div>

                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script type="text/javascript">
            var ChaosflixConfig = {
                pluginUniqueId: 'c4a05f11-4ccc-4b00-bdea-dbeef1337000'
            };

            (function () {
                var page = document.querySelector('#ChaosflixConfigPage');

                page.addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(ChaosflixConfig.pluginUniqueId).then(function (config) {
                        page.querySelector('#PreferredQuality').value = config.PreferredQuality || 'High';
                        page.querySelector('#PreferredFormat').value = config.PreferredFormat || 'Mp4';
                        page.querySelector('#PreferredLanguage').value = config.PreferredLanguage || '';
                        page.querySelector('#ApiBaseUrl').value = config.ApiBaseUrl || '';
                        Dashboard.hideLoadingMsg();
                    });
                });

                page.querySelector('#ChaosflixConfigForm').addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(ChaosflixConfig.pluginUniqueId).then(function (config) {
                        config.PreferredQuality = page.querySelector('#PreferredQuality').value;
                        config.PreferredFormat = page.querySelector('#PreferredFormat').value;
                        config.PreferredLanguage = page.querySelector('#PreferredLanguage').value;
                        config.ApiBaseUrl = page.querySelector('#ApiBaseUrl').value;
                        ApiClient.updatePluginConfiguration(ChaosflixConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });
                    e.preventDefault();
                    return false;
                });
            })();
        </script>
    </div>
</body>
</html>
